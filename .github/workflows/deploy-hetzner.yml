name: Manual Hetzner deploy
# Production releases use the pinned, tested workflow in Fahrdienst_website.
# Keep this optional direct path manual: this repository has no SSH credential.
on:
  workflow_dispatch:
concurrency:
  group: tariq-fahrdienst-app-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH vorbereiten
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY || secrets.HETZNER_SSH_KEY }}
          SSH_KEY_B64: ${{ secrets.HETZNER_SSH_KEY_B64 }}
          SSH_HOST: ${{ secrets.HETZNER_HOST || '167.233.32.243' }}
        run: |
          install -m 700 -d ~/.ssh
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          elif [ -n "$SSH_KEY_B64" ]; then
            printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/deploy_key
          else
            echo '::error::Kein Hetzner SSH-Key in diesem Repository verfügbar (HETZNER_SSH_KEY / HETZNER_SSH_PRIVATE_KEY / HETZNER_SSH_KEY_B64).'
            exit 1
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: App übertragen und starten
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST || '167.233.32.243' }}
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/tariq-fahrdienst-app.tar.gz .
          scp -i ~/.ssh/deploy_key /tmp/tariq-fahrdienst-app.tar.gz "fpadmin@${SSH_HOST}:/tmp/tariq-fahrdienst-app.tar.gz"
          ssh -i ~/.ssh/deploy_key "fpadmin@${SSH_HOST}" 'bash -s' < scripts/deploy-hetzner.sh
