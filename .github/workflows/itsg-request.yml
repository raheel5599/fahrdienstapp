name: ITSG local request checks
on:
  push:
    branches: [main]
    paths: ['tools/itsg-request/**', '.github/workflows/itsg-request.yml']
  pull_request:
    paths: ['tools/itsg-request/**', '.github/workflows/itsg-request.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/itsg-request/requirements-test.txt
      - name: Test synthetic requests and encrypted backup only
        run: python -m unittest discover -s tools/itsg-request -p 'test_*.py' -v
