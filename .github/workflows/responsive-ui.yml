name: Responsive UI checks
on:
  push:
    branches: [main, 'feature/ui-readiness-*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui
        env:
          UI_WEBKIT: '1'
      - run: npm run test:reports
        env:
          UI_WEBKIT: '1'
      - run: npm run test:offline
        env:
          UI_WEBKIT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-ui-screenshots
          path: test-results/
